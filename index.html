<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Box Smash">
<meta name="theme-color" content="#7cc6ff">
<link rel="apple-touch-icon" href="resources/icon.png">
<title>Box Smash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: portrait mobile game. Full-bleed WebGL canvas; DOM screens (home, game HUD, sheets, modals) layered above. Single bright casual look. */
:root{
  --maroon:#8e1330;
  --maroon-deep:#5e0a1f;
  --panel:#fff3dc;
  --panel-edge:#e9c98f;
  --gold:#ffc83d;
  --gold-deep:#c98a12;
  --green:#4cc72f;
  --green-deep:#2c8a16;
  --blue:#2f8cff;
  --purple:#6b3fc7;
  --ink:#ffffff;
  --text:#4a2414;
  --font-display:"Titan One","Arial Rounded MT Bold",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:#7cc6ff;color:var(--ink);font-family:var(--font-body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
input,textarea{-webkit-user-select:text;user-select:text;touch-action:manipulation}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0}
.stroke{text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 2px rgba(0,0,0,.4)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* ---------- shared bits ---------- */
.btn{border:0;cursor:pointer;font-family:var(--font-display);font-weight:400;color:#fff;border-radius:18px;padding:12px 22px;font-size:1.3rem;letter-spacing:.01em;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(2px)}
.btn-green{background:linear-gradient(#7be04f,#3fb11f);box-shadow:inset 0 -5px 0 var(--green-deep),0 4px 0 #1d5e0d,0 8px 16px rgba(0,0,0,.25);border:3px solid #c8ff9e}
.btn-blue{background:linear-gradient(#5fb0ff,#2c79e6);box-shadow:inset 0 -5px 0 #1a52a8,0 4px 0 #123b7a;border:3px solid #bfe0ff}
.btn-red{background:linear-gradient(#ff6a5a,#d93a2c);box-shadow:inset 0 -5px 0 #9a2116,0 4px 0 #6a140c;border:3px solid #ffc0b8}
.btn-gold{background:linear-gradient(#ffe07a,#ffb21f);color:#5a3500;text-shadow:none;box-shadow:inset 0 -5px 0 var(--gold-deep),0 4px 0 #7a4f00;border:3px solid #fff1b8}
.btn-purple{background:linear-gradient(#b07cff,#6b3fc7);box-shadow:inset 0 -5px 0 #3d1f96,0 4px 0 #24105e,0 8px 16px rgba(0,0,0,.25);border:3px solid #e2ccff}
.diff-tag{display:block;font:900 .8rem var(--font-body);letter-spacing:.08em;text-transform:uppercase;opacity:.95;margin-bottom:2px}
.panel-head[data-diff="1"]{background:linear-gradient(#ff6a5a,#c41818)}
.panel-head[data-diff="2"]{background:linear-gradient(#b07cff,#4a1fa0)}
.bk-box{width:100%;border:3px solid var(--panel-edge);border-radius:12px;padding:8px;font:700 .72rem ui-monospace,Menlo,monospace;color:var(--text);background:#fff;resize:none;word-break:break-all;-webkit-user-select:text;user-select:text}
.slot{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px;text-align:left;border:3px solid transparent}
.slot.active{border-color:var(--green)}
.slot-empty{background:#e9dcc3;color:#a07a5a;font:900 1.4rem var(--font-body);border-style:dashed}
.slot-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.slot-info b{font-weight:900;font-size:.9rem}
.slot-info small{font-weight:800;font-size:.72rem;color:#8a5a3a;display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.slot-btns{display:flex;flex-direction:column;gap:6px}
.sbtn{font-size:.85rem;padding:5px 10px;border-radius:10px}
.diff-note{border-radius:12px;padding:8px;color:#fff}
.diff-note.d1{background:#d93a2c}.diff-note.d2{background:#6b3fc7}
#loading[data-diff="1"]{background:radial-gradient(circle at 50% 40%,#ff6a5a,#8e1318 70%)}
#loading[data-diff="2"]{background:radial-gradient(circle at 50% 40%,#9b5cff,#2a0e6e 70%)}
#banner[data-diff="1"] h3{color:#ff8a7a;-webkit-text-stroke-color:#6a0a0a;text-shadow:0 4px 0 #6a0a0a}
#banner[data-diff="2"] h3{color:#d6b8ff;-webkit-text-stroke-color:#2a0e6e;text-shadow:0 4px 0 #2a0e6e}
.btn[disabled]{filter:grayscale(.8) brightness(.9);cursor:default}
.round-btn{width:44px;height:44px;border-radius:50%;border:3px solid #ffdca0;background:radial-gradient(circle at 40% 35%,#c4344f,var(--maroon-deep));display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3);color:#fff}
.round-btn svg{width:22px;height:22px}
.coin{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#ffcf33 45%,#d99100);box-shadow:inset 0 0 0 2px #b97700;flex:none}
.coin.sm{width:16px;height:16px}

/* ---------- home ---------- */
#home{display:flex;flex-direction:column;pointer-events:none}
#home > *{pointer-events:auto}
.topbar{display:flex;align-items:center;gap:8px;padding-inline:12px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.avatar{width:52px;height:52px;border-radius:50%;border:3px solid #fff;background:var(--av,#ff8fa3);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);flex:none;padding:0}
.avatar svg{width:34px;height:34px}
.chip{display:flex;align-items:center;gap:6px;background:rgba(40,10,30,.55);border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 12px 4px 5px;font-weight:900;font-size:1rem;font-variant-numeric:tabular-nums;color:#fff;cursor:pointer;min-width:0}
.heart{position:relative;width:28px;height:26px;flex:none;display:grid;place-items:center;font-weight:900;font-size:.85rem;color:#fff}
.heart svg{position:absolute;inset:0;width:100%;height:100%}
.heart b{position:relative;margin-top:-2px}
.spacer{flex:1}
.home-logo{margin-top:clamp(10px,4vh,40px);text-align:center;pointer-events:none}
.logo-word{font-family:var(--font-display);font-weight:400;font-size:clamp(3rem,15vw,4.6rem);line-height:.86;margin:0;display:inline-block;transform:rotate(-3deg)}
.logo-word .l1{display:block;color:#ffd84a;-webkit-text-stroke:3px #7a2a00;text-shadow:0 5px 0 #7a2a00,0 10px 18px rgba(0,0,0,.3)}
.logo-word .l2{display:block;color:#5ad1ff;-webkit-text-stroke:3px #12306e;text-shadow:0 5px 0 #12306e,0 10px 18px rgba(0,0,0,.3);font-size:1.12em}
.home-play{margin-top:auto;display:flex;justify-content:center;padding-bottom:22px}
#levelBtn{font-size:2rem;padding:14px 40px 12px;border-radius:22px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){#levelBtn{animation:none}}
.side-widgets{position:absolute;right:12px;top:calc(76px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px}
.widget{width:58px;border:0;background:none;cursor:pointer;color:#fff;font-weight:900;font-size:.62rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0}
.widget .w-ico{width:52px;height:52px;border-radius:16px;background:radial-gradient(circle at 40% 30%,#7d5cf0,#3d1f96);border:3px solid #ffdca0;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.widget .w-ico svg{width:30px;height:30px}
.widget span{background:rgba(40,10,30,.65);border-radius:6px;padding:1px 5px}

/* bottom nav */
#nav{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:linear-gradient(#b51d3f,var(--maroon));border-top:3px solid var(--gold);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav-btn{border:0;background:none;color:#ffd9de;font-weight:900;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 8px;cursor:pointer;position:relative}
.nav-btn svg{width:34px;height:34px}
.nav-btn[aria-current="page"]{background:linear-gradient(#e33a5d,#b51d3f);color:#fff;border-radius:16px 16px 0 0;margin-top:-12px;padding-top:14px;box-shadow:0 -3px 0 var(--gold)}
.nav-btn[aria-current="page"] svg{width:44px;height:44px}

/* ---------- full-page sheets (shop, leaderboard, profile) ---------- */
.sheet{background:linear-gradient(#b51d3f,var(--maroon) 40%,var(--maroon-deep));display:flex;flex-direction:column;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:4}
.sheet-head{position:relative;text-align:center;padding:calc(14px + env(safe-area-inset-top,0px)) 60px 10px}
.sheet-head h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.9rem;color:#fff;text-shadow:0 3px 0 var(--maroon-deep)}
.sheet-head .coins-mini{position:absolute;left:12px;top:calc(18px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.3);border-radius:999px;padding:3px 10px 3px 4px;font-weight:900;font-size:.9rem}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding-inline:14px;padding-block:6px 20px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:3px solid var(--panel-edge);border-radius:18px;color:var(--text);padding:12px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.section-title{align-self:center;font-family:var(--font-display);font-weight:400;font-size:1.15rem;background:linear-gradient(#ffe07a,#ffb21f);color:#5a2a00;border-radius:12px;padding:4px 18px;box-shadow:0 3px 0 var(--gold-deep)}
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.shop-item{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.shop-item .ico{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#8c66ff,#4a24b0);border:3px solid #ffdca0}
.shop-item .ico svg{width:38px;height:38px}
.shop-item b{font-weight:900;font-size:.95rem}
.shop-item small{font-weight:800;color:#8a5a3a;font-size:.75rem;line-height:1.2}
.price{display:flex;align-items:center;justify-content:center;gap:6px;font-size:1.05rem;padding:8px 10px;width:100%;border-radius:14px}
.owned{font-size:.72rem;font-weight:900;color:#6b3fc7}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(0,0,0,.25);border-radius:14px;padding:4px}
.tab{border:0;border-radius:10px;padding:8px;font-weight:900;font-size:1rem;background:transparent;color:#ffd9de;cursor:pointer}
.tab[aria-selected="true"]{background:linear-gradient(#ffe07a,#ffb21f);color:#5a2a00}
.lb-row{display:grid;grid-template-columns:34px 40px 1fr auto;align-items:center;gap:8px;background:var(--panel);border:3px solid var(--panel-edge);border-radius:16px;padding:6px 10px 6px 6px;color:var(--text);font-weight:900}
.lb-row .rank{width:30px;height:30px;border-radius:50%;background:#d9b37a;display:grid;place-items:center;color:#fff;font-size:.85rem}
.lb-row .avatar{width:38px;height:38px;border-width:2px}
.lb-row .avatar svg{width:24px;height:24px}
.lb-lvl{background:var(--maroon);color:#fff;border-radius:10px;padding:2px 10px;text-align:center;line-height:1.1;font-size:1.1rem;font-variant-numeric:tabular-nums}
.lb-lvl small{display:block;font-size:.6rem;opacity:.8}
.note{color:#ffd9de;font-weight:800;text-align:center;font-size:.85rem;line-height:1.4;margin:0}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat-grid div{background:#fff;border-radius:12px;padding:8px 4px;font-weight:900;font-size:.7rem;color:#8a5a3a}
.stat-grid b{display:block;font-size:1.3rem;color:var(--text)}
.av-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;justify-items:center}
.av-grid .avatar{width:56px;height:56px}
.av-grid .avatar[aria-pressed="true"]{outline:4px solid var(--green);outline-offset:2px}
.cos-cell{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.cos-cell .avatar{position:relative}
.cos-locked svg:first-child{filter:grayscale(.7) brightness(.85)}
.cos-lock{position:absolute;right:-6px;bottom:-6px;width:24px;height:24px}
.cos-lock svg{width:24px;height:24px}
.cos-price{display:flex;align-items:center;gap:3px;font-weight:900;font-size:.68rem;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
.name-row{display:flex;gap:8px;align-items:center}
.name-row input{flex:1;min-width:0;border:3px solid var(--panel-edge);border-radius:12px;padding:10px 12px;font:900 1rem var(--font-body);color:var(--text);background:#fff}

/* ---------- modals ---------- */
.modal{display:grid;place-items:center;padding-inline:20px;background:rgba(20,5,20,.6);z-index:20}
.panel{width:min(340px,100%);background:var(--panel);border:4px solid var(--panel-edge);border-radius:24px;color:var(--text);position:relative;box-shadow:0 10px 0 rgba(0,0,0,.2),0 20px 40px rgba(0,0,0,.35);animation:pop .25s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.panel-head{background:linear-gradient(#c42a4c,var(--maroon));border-radius:20px 20px 0 0;padding:12px 50px;text-align:center;border-bottom:4px solid var(--panel-edge)}
.panel-head h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.7rem;color:#fff;text-shadow:0 3px 0 var(--maroon-deep)}
.x-btn{position:absolute;right:-10px;top:-10px;width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 40% 35%,#ff5a5a,#c41818);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.x-btn svg{width:18px;height:18px}
.panel-body{padding:16px;display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center}
.panel-body p{margin:0;font-weight:800;line-height:1.4}
.boost-pick{background:#fff;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.boost-pick .lbl{font-weight:900;color:#a07a5a;font-size:.9rem}
.boost-row{display:flex;justify-content:center;gap:12px}
.pre-boost{width:64px;height:64px;border-radius:50%;border:3px solid #ffdca0;background:radial-gradient(circle at 40% 30%,#5aa6ff,#1f5fc2);display:grid;place-items:center;position:relative;cursor:pointer;padding:0}
.pre-boost svg{width:36px;height:36px}
.pre-boost[aria-pressed="true"]{outline:4px solid var(--green);outline-offset:2px}
.pre-boost .cnt,.boost .cnt{position:absolute;right:-4px;bottom:-4px;min-width:22px;height:22px;border-radius:11px;background:#d91e3a;border:2px solid #fff;color:#fff;font-weight:900;font-size:.75rem;display:grid;place-items:center;padding:0 4px}
.pre-boost.locked{background:radial-gradient(circle at 40% 30%,#5aa6ff,#1f5fc2);filter:saturate(.6)}
.big-num{font-family:var(--font-display);font-size:3rem;color:var(--maroon);line-height:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- loading ---------- */
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding-inline:24px;background:radial-gradient(circle at 50% 40%,#3ea0ff,#1a4fb8 70%);z-index:30}
#loading .tip{font-weight:900;font-size:1.05rem;max-width:280px;line-height:1.4}
#loading .dots{font-weight:900;opacity:.85}

/* ---------- game HUD ---------- */
#game{pointer-events:none}
#game > *{pointer-events:auto}
.balls-card{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top,0px));width:62px;border-radius:14px;background:#fff;border:3px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.25);overflow:hidden;text-align:center;pointer-events:none}
.balls-card small{display:block;background:var(--maroon);color:#fff;font-weight:900;font-size:.7rem;padding:2px 0}
.balls-card b{display:block;font-family:var(--font-display);font-weight:400;font-size:1.9rem;color:var(--maroon);line-height:1.15;font-variant-numeric:tabular-nums}
.balls-card.low b{color:#e0202a}
#gameGear{position:absolute;right:12px;top:calc(14px + env(safe-area-inset-top,0px))}
#gearMenu{position:absolute;right:12px;top:calc(66px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px}
.gm{width:44px;height:44px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3);color:#fff;background:radial-gradient(circle at 40% 35%,#7be04f,#2c8a16)}
.gm[aria-pressed="false"]{background:radial-gradient(circle at 40% 35%,#aaa,#666)}
.gm.exit{background:radial-gradient(circle at 40% 35%,#ff5a5a,#c41818)}
.gm svg{width:22px;height:22px}
.boosters{position:absolute;bottom:calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.boosters.left{left:12px}.boosters.right{right:12px}
.boost{width:58px;height:58px;border-radius:50%;border:3px solid #ffdca0;background:radial-gradient(circle at 40% 30%,#8c66ff,#4a24b0);display:grid;place-items:center;position:relative;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3);padding:0}
.boost svg{width:36px;height:36px}
.boost.active{box-shadow:0 0 0 4px #fff,0 0 18px 6px #ffe36b}
.boost.locked{cursor:default}
.boost .plus{background:var(--green)}
#banner{position:absolute;left:0;right:0;top:calc(70px + env(safe-area-inset-top,0px));text-align:center;pointer-events:none;animation:pop .25s}
#banner h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:2.1rem;color:#ffd84a;-webkit-text-stroke:2px #8a1a00;text-shadow:0 4px 0 #8a1a00}
#banner p{margin:4px 0 0;font-weight:900;font-size:1rem;text-shadow:0 2px 4px rgba(0,0,0,.6)}
#banner .bar{width:150px;height:10px;margin:8px auto 0;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden;border:2px solid #fff}
#banner .bar i{display:block;height:100%;background:linear-gradient(#9cff5a,#3fb11f);width:100%}
#tapHint{position:absolute;left:0;right:0;bottom:calc(190px + env(safe-area-inset-bottom,0px));text-align:center;font-family:var(--font-display);font-size:1.5rem;color:#fff;-webkit-text-stroke:1.5px #12306e;text-shadow:0 3px 0 #12306e;pointer-events:none;animation:pulse 1.2s infinite}

/* ---------- win ---------- */
#win{display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding-inline:20px;padding-block:calc(30px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));background:radial-gradient(circle at 50% 40%,rgba(60,20,60,.55),rgba(10,0,20,.88));z-index:25}
.well{font-family:var(--font-display);font-weight:400;font-size:clamp(2.8rem,14vw,4rem);margin:0;color:#ffe14a;-webkit-text-stroke:3px #a8200a;text-shadow:0 5px 0 #a8200a,0 10px 20px rgba(0,0,0,.4);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.reward{display:flex;flex-direction:column;align-items:center;gap:4px}
.coin-pile{position:relative;width:120px;height:80px}
.coin-pile .coin{position:absolute;width:34px;height:34px}
.reward b{font-family:var(--font-display);font-weight:400;font-size:2.4rem;color:#fff;-webkit-text-stroke:1.5px #7a4f00}
.progress-card{width:min(320px,100%);background:linear-gradient(#c42a4c,var(--maroon));border:3px solid var(--gold);border-radius:18px;padding:10px 14px 14px;font-weight:900}
.pbar{position:relative;height:22px;border-radius:12px;background:#3a0a18;border:2px solid #fff;margin-top:8px;overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#9cff5a,#3fb11f);transition:width .8s .3s}
.pbar span{position:relative;display:block;text-align:center;font-size:.8rem;line-height:18px;text-shadow:0 1px 2px #000}
.win-actions{display:flex;gap:10px;width:min(320px,100%)}
.win-actions .btn{flex:1}

/* confetti */
#confetti{pointer-events:none;z-index:28}
#confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--r))}}
#burstLogo{display:grid;place-items:center;pointer-events:none;z-index:23}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
if (!window.THREE || !window.CANNON){ $('err').hidden = false; return; }

/* =========================================================
   SAVE DATA
   ========================================================= */
// Three save profiles. Slot 1 keeps the original key so existing progress carries over.
const SLOTS = 3;
const slotKey = n => n === 1 ? 'boxsmash.save.v2' : 'boxsmash.save.v2.s' + n;
const DEFAULT = {
  level: 0, coins: 200, lives: 5, lifeTs: 0,
  boosters: { inf: 2, big: 2, wand: 3, bomb: 0 },
  set: { music: true, sound: true, vib: true },
  profile: { name: 'Player', avatar: 0, frame: 0 },
  owned: { avatars: [0, 1], frames: [0] },
  stats: { won: 0, firstTry: 0, streak: 0, best: 0 },
  fails: {}, seenHint: false, codes: [],
};
const fresh = () => JSON.parse(JSON.stringify(Object.assign({}, DEFAULT, { lifeTs: Date.now() })));
function readSlot(n){
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(slotKey(n)) || 'null'); } catch(e){}
  if (!raw) return null;
  const d = Object.assign(fresh(), raw);
  d.boosters = Object.assign({}, DEFAULT.boosters, d.boosters); d.set = Object.assign({}, DEFAULT.set, d.set);
  d.profile = Object.assign({}, DEFAULT.profile, d.profile); d.stats = Object.assign({}, DEFAULT.stats, d.stats);
  d.owned = Object.assign({ avatars: [0, 1], frames: [0] }, d.owned);
  if (!d.owned.avatars.includes(d.profile.avatar)) d.owned.avatars.push(d.profile.avatar);
  return d;
}
let SLOT = 1;
try { SLOT = Math.min(SLOTS, Math.max(1, parseInt(localStorage.getItem('boxsmash.slot') || '1', 10) || 1)); } catch(e){}
let S = readSlot(SLOT) || fresh();
function save(){ try { localStorage.setItem(slotKey(SLOT), JSON.stringify(S)); localStorage.setItem('boxsmash.slot', String(SLOT)); } catch(e){} }

const MAX_LIVES = 5, LIFE_MS = 30 * 60 * 1000, BOMB_UNLOCK = 10;
const bombLocked = () => S.level < BOMB_UNLOCK && !S.allUnlocked;
function tickLives(){
  if (S.lives >= MAX_LIVES){ S.lifeTs = Date.now(); return; }
  const n = Math.floor((Date.now() - S.lifeTs) / LIFE_MS);
  if (n > 0){ S.lives = Math.min(MAX_LIVES, S.lives + n); S.lifeTs += n * LIFE_MS; if (S.lives >= MAX_LIVES) S.lifeTs = Date.now(); save(); }
}
function loseLife(){ tickLives(); if (S.lives >= MAX_LIVES) S.lifeTs = Date.now(); S.lives = Math.max(0, S.lives - 1); save(); }

/* =========================================================
   AUDIO + HAPTICS
   ========================================================= */
let ac = null;
function actx(){ try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch(e){} return ac; }
function tone(freq, dur = .1, vol = .05, type = 'sine', slide = 0){
  if (!S.set.sound) return; const a = actx(); if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
  } catch(e){}
}
function noise(dur = .4, vol = .35, freq = 700){
  if (!S.set.sound) return; const a = actx(); if (!a) return;
  try {
    const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
    s.buffer = buf; s.connect(f).connect(g).connect(a.destination); s.start();
  } catch(e){}
}
const pop = () => tone(500 + Math.random() * 200, .06, .05, 'triangle', 1.8);
const click = () => tone(700, .05, .04, 'triangle');
const buzz = ms => { if (S.set.vib && navigator.vibrate) try { navigator.vibrate(ms); } catch(e){} };
// light background music: a looping pentatonic tune
let musicTimer = null, musicStep = 0;
const TUNE = [523, 659, 784, 659, 587, 784, 880, 784, 659, 523, 587, 659, 523, 440, 523, 587];
function musicOn(){
  if (musicTimer || !S.set.music) return;
  musicTimer = setInterval(() => {
    const a = ac; if (!a || a.state !== 'running' || !S.set.music) return;
    const f = TUNE[musicStep++ % TUNE.length];
    try {
      const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
      o.type = 'triangle'; o.frequency.value = f / 2;
      g.gain.setValueAtTime(.018, t); g.gain.exponentialRampToValueAtTime(.0001, t + .32);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t + .34);
    } catch(e){}
  }, 300);
}
function musicOff(){ clearInterval(musicTimer); musicTimer = null; }
document.addEventListener('pointerdown', () => { actx(); if (S.set.music) musicOn(); }, { once: false, passive: true });

/* =========================================================
   THREE SCENE
   ========================================================= */
const cv = $('cv');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, .1, 500);

function canvasTex(w, h, paint, repeatY = 1){
  const c = document.createElement('canvas'); c.width = w; c.height = h; paint(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  if (repeatY !== 1){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, repeatY); }
  return t;
}
function crownPath(g, cx, cy, s){
  g.beginPath();
  g.moveTo(cx - s, cy + s * .55); g.lineTo(cx + s, cy + s * .55); g.lineTo(cx + s * 1.05, cy - s * .45);
  g.lineTo(cx + s * .5, cy); g.lineTo(cx, cy - s * .7); g.lineTo(cx - s * .5, cy); g.lineTo(cx - s * 1.05, cy - s * .45); g.closePath();
}
function skyTex(top, mid, low){
  return canvasTex(4, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, top); gr.addColorStop(.6, mid); gr.addColorStop(1, low); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
}

// lighting
scene.add(new THREE.HemisphereLight(0xdcefff, 0x6a8a3a, .85));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.15);
sun.position.set(5, 14, 9); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 10, bottom: -4, near: 1, far: 40 });
sun.shadow.bias = -.0006; sun.target.position.set(0, 1, 0); scene.add(sun, sun.target);

/* ---------- arenas ---------- */
const PL = { w: 7.0, d: 2.6, top: 1.75, h: .26 };
const arenas = {};
function mat(c, o = {}){ return new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .85 }, o)); }
function makeCloud(){
  const t = canvasTex(128, 64, (g, w, h) => {
    g.fillStyle = '#fff';
    [[34, 40, 22], [60, 30, 28], [88, 38, 22], [50, 46, 18], [76, 46, 18]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); });
  });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, opacity: .95, fog: false })); return s;
}
function castle(x, z, s, roof){
  const g = new THREE.Group(), wallM = mat(0xe8e4f4), roofM = mat(roof);
  const keep = new THREE.Mesh(new THREE.BoxGeometry(3, 2.4, 2), wallM); keep.position.y = 1.2; g.add(keep);
  [[-1.8, 3.4, .55], [1.8, 3.4, .55], [0, 4.6, .7], [-.9, 3.9, .45], [.9, 3.9, .45]].forEach(([tx, h, r]) => {
    const tw = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 10), wallM); tw.position.set(tx, h / 2, 0); g.add(tw);
    const rf = new THREE.Mesh(new THREE.ConeGeometry(r * 1.3, r * 2.2, 10), roofM); rf.position.set(tx, h + r * 1.1, 0); g.add(rf);
  });
  g.position.set(x, 0, z); g.scale.setScalar(s); return g;
}
function buildMeadow(){
  const g = new THREE.Group();
  const ground = new THREE.Mesh(new THREE.CircleGeometry(120, 48), mat(0x6ccf3f)); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; g.add(ground);
  const dirt = new THREE.Mesh(new THREE.CircleGeometry(4.2, 40), mat(0xc9a066)); dirt.rotation.x = -Math.PI / 2; dirt.position.y = .01; dirt.receiveShadow = true; g.add(dirt);
  const hillM = mat(0x58b836, { flatShading: false });
  [[-28, -45, 16], [0, -60, 22], [26, -48, 18], [-12, -30, 8], [14, -28, 7]].forEach(([x, z, r]) => { const h = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), hillM); h.position.set(x, -r * .35, z); h.scale.y = .5; g.add(h); });
  const mtnM = mat(0x8fa6c8);
  [[-40, -90, 20], [-18, -95, 26], [20, -92, 24], [44, -88, 18]].forEach(([x, z, r]) => { const m = new THREE.Mesh(new THREE.ConeGeometry(r, r * 1.4, 6), mtnM); m.position.set(x, r * .55, z); g.add(m); const cap = new THREE.Mesh(new THREE.ConeGeometry(r * .32, r * .45, 6), mat(0xffffff)); cap.position.set(x, r * 1.12, z); g.add(cap); });
  g.add(castle(0, -42, 1.6, 0x7a5cf0));
  const treeM = mat(0x3f9a2a), trunkM = mat(0x8a5a2a);
  [[-9, -10], [10, -12], [-14, -20], [16, -22], [-6, -24]].forEach(([x, z]) => { const t = new THREE.Mesh(new THREE.CylinderGeometry(.25, .3, 1.4, 6), trunkM); t.position.set(x, .7, z); g.add(t); const c = new THREE.Mesh(new THREE.SphereGeometry(1.4, 10, 8), treeM); c.position.set(x, 2.1, z); g.add(c); });
  // banners
  [[-4.6, -3], [4.6, -3]].forEach(([x, z]) => {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(.06, .06, 3.2, 6), mat(0xffc83d, { metalness: .6, roughness: .3 })); pole.position.set(x, 1.6, z); g.add(pole);
    const flag = new THREE.Mesh(new THREE.PlaneGeometry(.8, 1.3), new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, map: canvasTex(64, 104, (c, w, h) => { c.fillStyle = '#6b3fc7'; c.fillRect(0, 0, w, h - 16); c.beginPath(); c.moveTo(0, h - 16); c.lineTo(w / 2, h); c.lineTo(w, h - 16); c.fill(); c.fillStyle = '#ffc83d'; crownPath(c, w / 2, 40, 14); c.fill(); }) }));
    flag.position.set(x + .45, 2.5, z); g.add(flag);
  });
  g.userData = { sky: skyTex('#3f9bff', '#8fd0ff', '#d7f1ff'), fog: 0xbfe4ff };
  return g;
}
function buildBeach(){
  const g = new THREE.Group();
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), mat(0x2fb6e8, { roughness: .25, metalness: .1 })); sea.rotation.x = -Math.PI / 2; sea.position.y = -.05; g.add(sea);

function mulberry32(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ARENA_OF = n => Math.floor(n / 5) % 2 ? 'beach' : 'meadow';
// 0 = normal, 1 = Hard, 2 = Super Hard. Levels never run out: every level number is generated.
function difficulty(n){
  if (n < 9) return 0;
  const r = mulberry32((n + 1) * 104729)();
  if ((n + 1) % 20 === 0 || r < .04) return 2;
  if ((n + 1) % 5 === 0 || r < .12) return 1;
  return 0;
}
const DIFF = [
  { name: '', cap: 118 },
  { name: 'Hard Level', cap: 140 },
  { name: 'Super Hard Level', cap: 160 },
];
function buildLevel(n){
  const diff = difficulty(n);
  const rnd = mulberry32((n + 1) * 7919), pick = a => a[Math.floor(rnd() * a.length)];
  const P = [], step = .52, rh = .502, top = PL.top;
  const place = (t, c, x, y, z) => P.push({ t, c, x, y, z });
  const cubeCols = ['pink', 'blue', 'white', 'orange', 'gold', 'green', 'red'];
  let cols, rows, layers = 1, mode;
  if (n < 3){ cols = [5, 7, 9][n]; rows = [3, 4, 5][n]; mode = 'checker'; }
  else {
    cols = 8 + Math.floor(rnd() * 4);
    layers = diff || (n > 6 && rnd() < .55) ? 2 : 1;
    rows = Math.min(12, 5 + Math.floor(n / 2)) + (diff ? diff + 1 : 0);
    rows = Math.max(4, Math.min(rows, 13, Math.floor(DIFF[diff].cap / (cols * layers))));
    mode = diff === 2 ? pick(['pillars', 'castle', 'blocks']) : pick(['checker', 'pillars', 'castle', 'stripes', 'blocks']);
  }
  const c1 = pick(cubeCols), c2 = pick(cubeCols.filter(x => x !== c1)), c3 = pick(cubeCols.filter(x => x !== c1 && x !== c2));
  const x0 = -(cols - 1) * step / 2;
  for (let l = 0; l < layers; l++){
    const z = layers === 1 ? 0 : (l === 0 ? step / 2 : -step / 2);
    for (let c = 0; c < cols; c++){
      const x = x0 + c * step;
      let kind = 'cube';
      if (mode === 'pillars') kind = c % 3 === 1 ? 'pillar' : (c % 3 === 0 ? 'can' : 'cube');
      else if (mode === 'castle') kind = (c === 0 || c === cols - 1) ? 'can' : 'cube';
      else if (mode === 'blocks') kind = Math.floor(c / 3) % 2 ? 'pillar' : 'can';
      let r = 0;
      if (kind === 'pillar'){
        for (; r + 4 <= rows; r += 4) place('pillar', 'blue', x, top + r * rh + 1.0 + .001, z);
        kind = 'can';
      }
      for (; r < rows; r++){
        let t = kind, color = c1;
        if (mode === 'checker') color = ((Math.floor(c / (n < 3 ? 1 : 3)) + Math.floor(r / (n < 3 ? 1 : 3))) % 2) ? c1 : c2;
        else if (mode === 'stripes'){ color = [c1, c2, c3][r % 3]; if (c % 4 === 3) t = 'can'; }
        else if (mode === 'castle') color = r % 2 ? c1 : c2;
        else if (mode === 'pillars') color = c2;
        place(t, color, x, top + r * rh + .25 + .001, z);
      }
    }
  }
  if (mode === 'castle' || mode === 'pillars'){
    const yTop = top + rows * rh + .15 + .002;
    for (let c = 1; c + 1 < cols; c += 3){ const x = x0 + c * step; place('cap', 'pink', x, yTop, 0); if (layers === 1 && mode === 'castle') place('can', 'gold', x, yTop + .4, 0); }
  }
  // harder levels: more pieces per ball
  const balls = diff === 2 ? Math.max(14, Math.min(36, Math.ceil(P.length / 5) + 3))
    : diff === 1 ? Math.max(12, Math.min(34, Math.ceil(P.length / 4.2) + 4))
    : Math.max(10, Math.min(32, Math.ceil(P.length / 3.4) + 6));
  return { pieces: P, balls, arena: ARENA_OF(n), diff };
}

/* ---------- aiming ---------- */
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const aimPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const GV = new THREE.Vector3(0, -9.82, 0);
function screenRay(cx, cy){
  const r = cv.getBoundingClientRect();
  ndc.set((cx - r.left) / r.width * 2 - 1, -(cy - r.top) / r.height * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
}
function pickPiece(cx, cy){
  screenRay(cx, cy);
  const hit = raycaster.intersectObjects(pieces.filter(p => !p.dead).map(p => p.mesh), false)[0];
  return hit ? { piece: hit.object.userData.piece, point: hit.point } : null;
}
function targetAt(cx, cy){
  const h = pickPiece(cx, cy);
  if (h) return h.point.clone();
  const p = raycaster.ray.intersectPlane(aimPlane, new THREE.Vector3());
  if (!p) return null;
  p.y = Math.max(.2, p.y); return p;
}
function solve(target){
  let dir = target.clone().sub(PIVOT).normalize(), m0, v;
  for (let k = 0; k < 3; k++){
    m0 = PIVOT.clone().addScaledVector(dir, MUZZLE_LEN);
    const d = target.clone().sub(m0), t = Math.max(.28, Math.min(.6, d.length() / 22));
    v = d.sub(GV.clone().multiplyScalar(.5 * t * t)).divideScalar(t);
    dir = v.clone().normalize();
  }
  return { m0, v, dir };

/* =========================================================
   UPDATE LOOP
   ========================================================= */
const FIRE_RATE = .26, INF_RATE = .07;
let homeA = 0;
function update(dt){
  if (!G) return;
  G.time += dt;
  world.step(1 / 60, dt, 4);

  // pieces: sync, and shatter anything that fell off the platform
  let left = 0;
  for (const p of pieces){
    if (p.dead) continue;
    const b = p.body;
    p.mesh.position.copy(b.position); p.mesh.quaternion.copy(b.quaternion);
    const off = b.position.y < PL.top - .9 || Math.abs(b.position.x) > PL.w / 2 + 2.5 || Math.abs(b.position.z) > 5;
    // anything below the platform that hits the ground, or comes to rest off the platform, is cleared
    if (off && (b.position.y < .45 || b.sleepState === CANNON.Body.SLEEPING || b.velocity.length() < .15)) shatter(p, mode !== 'play');
    else if (b.position.y > PL.top - .4 && Math.abs(b.position.x) < PL.w / 2 + .3 && Math.abs(b.position.z) < PL.d / 2 + .3) left++;
    else if (b.position.y >= .45) left++; // still falling
  }
  G.left = left;

  for (const s of balls){
    s.t += dt; s.mesh.position.copy(s.body.position); s.mesh.quaternion.copy(s.body.quaternion);
    if (s.t > 4 || s.body.position.y < .25 && s.t > .5 || s.body.position.z < -12){ s.done = true; rmBody(s.body); scene.remove(s.mesh); }
  }
  balls = balls.filter(s => !s.done);

  for (const d of parts){
    d.v.y -= 9.82 * dt; d.mesh.position.addScaledVector(d.v, dt);
    d.mesh.rotation.x += d.r.x * dt; d.mesh.rotation.y += d.r.y * dt;
    if (d.mesh.position.y < .05){ d.mesh.position.y = .05; d.v.y *= -.25; d.v.x *= .5; d.v.z *= .5; d.r.multiplyScalar(.5); }
    d.life -= dt; if (d.life < .35) d.mesh.scale.multiplyScalar(.9);
  }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0){ scene.remove(parts[i].mesh); parts.splice(i, 1); }
  for (let i = fx.length - 1; i >= 0; i--){
    const f = fx[i]; f.t += dt; const k = f.t / f.dur;
    f.obj.scale.setScalar(1 + k * f.grow); f.obj.material.opacity = Math.max(0, .9 * (1 - k));
    if (k >= 1){ scene.remove(f.obj); f.obj.geometry.dispose(); f.obj.material.dispose(); fx.splice(i, 1); }
  }

  if (mode === 'play'){
    // continuous fire while held
    G.fireCd -= dt;
    if (G.inf > 0){
      G.inf -= dt; $('bnFill').style.width = Math.max(0, G.inf / 3 * 100) + '%';
      if (G.inf <= 0){ G.inf = 0; hideBanner(); renderBoosters(); hudBalls(); }
    }
    if (G.holding && G.aimTarget && !G.armed && G.fireCd <= 0){
      if (shoot(G.aimTarget)) G.fireCd = G.inf > 0 ? INF_RATE : FIRE_RATE;
    }
    if (G.lastShotT >= 0) G.lastShotT += dt;

    const moving = pieces.some(p => !p.dead && p.body.sleepState !== CANNON.Body.SLEEPING && p.body.velocity.length() > .3);
    G.quiet = moving || balls.length ? 0 : G.quiet + dt;
    if (G.state === 'play'){
      if (G.left === 0 && G.time > .5){ G.state = 'won'; G.endT = 0; G.holding = false; }
      else if (G.balls <= 0 && G.inf <= 0 && !S.endless && !balls.length && (G.quiet > 1.4 || G.lastShotT > 6)){ G.state = 'out'; G.endT = 0; G.holding = false; }
    } else if (G.state === 'won'){
      G.endT += dt; if (G.endT > .3 && !G.burst){ G.burst = true; winBurst(); }
    } else if (G.state === 'out'){
      G.endT += dt; if (G.endT > .4 && !G.outShown){ G.outShown = true; outOfBalls(); }
    }
  }

  // cannon aim
  if (G.aim){
    const d = G.aim.dir, yaw = Math.atan2(d.x, -d.z), pitch = Math.asin(Math.max(-1, Math.min(1, d.y)));
    aimer.rotation.y += (-yaw - aimer.rotation.y) * Math.min(1, dt * 20);
    aimer.rotation.x += (pitch - aimer.rotation.x) * Math.min(1, dt * 20);
  }
  G.recoil = Math.max(0, (G.recoil || 0) - dt * 6); barrel.position.z = G.recoil * .18;

  // camera
  G.shake = Math.max(0, (G.shake || 0) - dt);
  if (mode === 'home'){
    homeA += dt * (reduceMotion ? 0 : .12);
    camera.position.set(Math.sin(homeA) * 9.5, 4.2, Math.cos(homeA) * 9.5);
    camera.lookAt(0, 2.6, 0);
  } else {
    const sh = reduceMotion ? 0 : G.shake * .3;
    camera.position.set((Math.random() - .5) * sh, 3.1 + (Math.random() - .5) * sh, 10.6);
    camera.lookAt(0, 3.05, 0);
  }
  for (const c of clouds){ c.position.x += dt * .6; if (c.position.x > 60) c.position.x = -60; }
}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize(){
  const W = cv.clientWidth, H = cv.clientHeight; if (!W || !H) return;
  renderer.setSize(W, H, false); camera.aspect = W / H;
  const hfov = 44 * Math.PI / 180;
  camera.fov = Math.min(88, Math.max(40, 2 * Math.atan(Math.tan(hfov / 2) / camera.aspect) * 180 / Math.PI));
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(cv);

let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

  if (G.armed === 'wand'){
    const h = pickPiece(e.clientX, e.clientY);
    if (!h){ toast('Tap a block to zap it'); return; }
    const center = h.piece.body.position; let n = 0;
    pieces.filter(p => !p.dead).map(p => [p, Math.hypot(p.body.position.x - center.x, p.body.position.y - center.y, p.body.position.z - center.z)])
      .sort((a, b) => a[1] - b[1]).slice(0, 5).forEach(([p, d]) => { if (d < .8){ sparkle(new THREE.Vector3(p.body.position.x, p.body.position.y, p.body.position.z), 0xff7ad9); shatter(p, true); n++; } });

  ptr = e.pointerId; G.holding = true; G.aimTarget = t;
  if (G.balls <= 0 && G.inf <= 0 && !S.endless){ G.holding = false; return; }
  if (G.fireCd <= 0){ shoot(t); G.fireCd = G.inf > 0 ? INF_RATE : FIRE_RATE; }

  tone(880, .1, .05, 'triangle'); toast(`Playing Profile ${n}`);
  armedReset = 0; modalClose = null; goHome();
}
function resetSlot(n){
  if (n === SLOT){ const keepSet = S.set; S = fresh(); S.set = keepSet; save(); }
  else { try { localStorage.removeItem(slotKey(n)); } catch(e){} }
  tone(300, .2, .06, 'square', .5); buzz(40); toast(`Profile ${n} reset`);
  if (n === SLOT){ modalClose = null; goHome(); slotsModal(); } else slotsModal();
}

/* ---------- backup & restore ----------
   A backup code is the current profile's save as text: "BXS1-" + checksum + "-" + base64 data.
   Pasting it back restores that progress into the profile you're playing. */
function fnv(str){ let x = 0x811c9dc5; for (let i = 0; i < str.length; i++){ x ^= str.charCodeAt(i); x = Math.imul(x, 0x01000193) >>> 0; } return x.toString(36); }
function makeBackup(){
  const json = JSON.stringify(S), b64 = btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return `BXS1-${fnv(b64)}-${b64}`;
}
function readBackup(code){
  const m = String(code).replace(/\s+/g, '').match(/^BXS1-([0-9a-z]+)-([A-Za-z0-9_-]+)$/);
  if (!m) return { err: 'That isn\u2019t a Box Smash backup code.' };
  if (fnv(m[2]) !== m[1]) return { err: 'This code is damaged or incomplete. Copy the whole code and try again.' };
  try {
    let b = m[2].replace(/-/g, '+').replace(/_/g, '/'); while (b.length % 4) b += '=';
    const data = JSON.parse(decodeURIComponent(escape(atob(b))));
    if (typeof data !== 'object' || typeof data.level !== 'number') throw 0;
    return { data };
  } catch(e){ return { err: 'This code could not be read.' }; }
}
let restoreArmed = false;
function backupModal(){
  const code = makeBackup();
  restoreArmed = false;
  openModal('Backup & Restore', `
    <p style="text-align:left">Your backup code for <b>Profile ${SLOT}</b> (Level ${fmt(S.level + 1)}, ${fmt(S.coins)} coins). Save it somewhere safe.</p>
    <textarea id="bkOut" readonly rows="3" aria-label="Backup code" class="bk-box">${code}</textarea>
    <button class="btn btn-blue" data-copy style="font-size:1.05rem">Copy Code</button>
    <hr style="border:0;border-top:2px dashed var(--panel-edge);width:100%;margin:2px 0">
    <p style="text-align:left">Restore: paste a backup code. It replaces Profile ${SLOT}.</p>
    <textarea id="bkIn" rows="3" placeholder="BXS1-..." aria-label="Paste a backup code" class="bk-box"></textarea>
    <p id="bkMsg" style="min-height:1.2em;color:#d91e3a;font-size:.85rem"></p>
    <button class="btn btn-green" data-restore style="font-size:1.05rem">Restore</button>`, el => {
    const out = el.querySelector('#bkOut'), inp = el.querySelector('#bkIn'), msg = el.querySelector('#bkMsg'), rb = el.querySelector('[data-restore]');
    el.querySelector('[data-copy]').addEventListener('click', e => {
      const btn = e.currentTarget;
      const done = () => { btn.textContent = 'Copied!'; tone(988, .1, .05, 'triangle'); setTimeout(() => btn.textContent = 'Copy Code', 1500); };
      try { navigator.clipboard.writeText(code).then(done, () => { out.focus(); out.select(); btn.textContent = 'Selected, copy it'; }); }
      catch(err){ out.focus(); out.select(); btn.textContent = 'Selected, copy it'; }
    });
    inp.addEventListener('input', () => { restoreArmed = false; rb.textContent = 'Restore'; rb.className = 'btn btn-green'; msg.textContent = ''; });
    rb.addEventListener('click', () => {
      const r = readBackup(inp.value);
      if (r.err){ msg.textContent = r.err; tone(200, .15, .05, 'square'); return; }
      if (!restoreArmed){
        restoreArmed = true; rb.className = 'btn btn-red'; rb.textContent = `Replace Profile ${SLOT}?`;
        msg.style.color = '#6b3fc7'; msg.textContent = `Code is valid: Level ${fmt((r.data.level || 0) + 1)}, ${fmt(r.data.coins || 0)} coins. Tap again to restore.`;
        return;
      }
      try { localStorage.setItem(slotKey(SLOT), JSON.stringify(r.data)); } catch(e){}
      S = readSlot(SLOT) || fresh(); save();
      if (S.set.music){ actx(); musicOn(); } else musicOff();
      tone(784, .12, .06, 'triangle'); setTimeout(() => tone(1319, .25, .06, 'triangle'), 120); confetti(50); buzz(40);
      modalClose = null; goHome(); toast('Progress restored!');
    });
  });
}

/* ---------- secret codes ----------
   Codes are stored as hashes so they can't be read straight from the source.
   Each code works once per player. To add one: hash it with codeHash('YOURCODE') in the console. */
function codeHash(s){ let x = 0x811c9dc5; for (const c of 'bx$' + s){ x ^= c.charCodeAt(0); x = Math.imul(x, 0x01000193) >>> 0; } return x.toString(36); }
const CODES = {
  '1a299vu': { amount: true },   // SMASH10: type any coin amount, works every time
  '1qewxir': { maxAll: true },   // SMASHEVER: unlocks and maxes everything (level stays the same)
};

function codeModal(){
  openModal('Redeem Code', `<p>Enter a secret code.</p>${S.codeRevealed ? `<p style="font-size:.85rem;color:#6b3fc7">Your level 200 code: <b style="letter-spacing:.08em">${secretCode()}</b></p>` : ''}

function confetti(n = 90){
  if (reduceMotion) return;
  const box = $('confetti'), cols = ['#ff4fa8', '#ffd21f', '#3f8cff', '#4cc72f', '#ff8a1f', '#a364ef', '#ffffff'];
  for (let i = 0; i < n; i++){
    const c = document.createElement('i');
    c.style.left = Math.random() * 100 + '%'; c.style.background = cols[i % cols.length];
    c.style.setProperty('--dx', (Math.random() - .5) * 160 + 'px'); c.style.setProperty('--r', (Math.random() * 1080 - 540) + 'deg');
    c.style.animationDuration = 1.6 + Math.random() * 1.6 + 's'; c.style.animationDelay = Math.random() * .4 + 's';
    box.appendChild(c); setTimeout(() => c.remove(), 4000);
  }
}
function winBurst(){
  tone(784, .14, .06, 'triangle'); setTimeout(() => tone(988, .14, .06, 'triangle'), 120); setTimeout(() => tone(1319, .3, .06, 'triangle'), 240); buzz(60);
  $('game').hidden = true; hideBanner(); $('burstLogo').hidden = false; confetti();
  setTimeout(() => { $('burstLogo').hidden = true; showWin(); }, 1500);
}
function showWin(){
  const first = !S.fails[S.level], earned = Math.min(40, 15 + G.balls) * (1 + (G.diff || 0));
  S.coins += earned; S.stats.won++; S.stats.streak++; S.stats.best = Math.max(S.stats.best, S.stats.streak); if (first) S.stats.firstTry++;
  const done = S.level + 1; S.level = done;
  let unlockMsg = '';
  if (done % 10 === 0){
    if (done === BOMB_UNLOCK){ S.boosters.bomb += 2; unlockMsg = 'New item unlocked: Bomb!'; }
    else { S.boosters.inf++; S.boosters.big++; S.boosters.wand++; S.boosters.bomb++; unlockMsg = 'Booster chest: +1 of each booster!'; }
  }
  save();
  $('winCoins').textContent = '+' + earned + (G.diff ? `  (${G.diff === 2 ? 'x3' : 'x2'})` : '');
  $('coinPile').innerHTML = Array.from({ length: 9 }, (_, i) => `<span class="coin" style="left:${10 + (i % 4) * 22 + (i > 3 ? 11 : 0)}px;top:${40 - Math.floor(i / 4) * 16}px"></span>`).join('');
  const prog = done % 10 === 0 ? 10 : done % 10;
  $('itemTxt').textContent = `${prog}/10`; $('itemFill').style.width = '0';
  showOnly('win'); confetti(50);
  requestAnimationFrame(() => requestAnimationFrame(() => { $('itemFill').style.width = prog * 10 + '%'; }));
  if (unlockMsg) setTimeout(() => toast(unlockMsg), 900);
}

function shopCos(kind, i){
  const owned = (kind === 'av' ? S.owned.avatars : S.owned.frames).includes(i);
  const item = kind === 'av' ? AV_INFO[i] : FRAMES[i];
  const style = kind === 'av' ? avStyle(i, 0) : avStyle(S.profile.avatar, i);
  return `<div class="cos-cell"><button class="avatar" style="${style}" data-scos="${kind}" data-i="${i}" aria-label="${item.name}${owned ? ', owned' : ', ' + item.price + ' coins'}">${avatarSvg(kind === 'av' ? i : S.profile.avatar)}</button>
    <span class="cos-price">${owned ? 'Owned' : `<span class="coin sm"></span>${fmt(item.price)}`}</span></div>`;
}

/* ---------- leaderboard ---------- */
let boardTab = 'world';
function renderBoard(){
  $('boardBody').innerHTML = `
    <div class="tabs" role="tablist"><button class="tab" role="tab" data-t="world" aria-selected="${boardTab === 'world'}">World</button><button class="tab" role="tab" data-t="country" aria-selected="${boardTab === 'country'}">Türkiye</button></div>
    <div class="lb-row"><span class="rank">1</span><span class="avatar" style="${avStyle(S.profile.avatar, S.profile.frame)}">${avatarSvg(S.profile.avatar)}</span><span>${escapeHtml(S.profile.name)} (you)</span><span class="lb-lvl"><small>Level</small>${S.level + 1}</span></div>
    <p class="note">Other players appear here once the game is live on the App Store with Game Center.</p>`;
  $('boardBody').querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { boardTab = t.dataset.t; click(); renderBoard(); }));
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---------- profile ---------- */
let profTab = 'av', pickAv = 0, pickFr = 0, draftName = '';
function cosmeticCell(kind, i, picked){
  const owned = (kind === 'av' ? S.owned.avatars : S.owned.frames).includes(i);
  const item = kind === 'av' ? AV_INFO[i] : FRAMES[i];
  const style = kind === 'av' ? avStyle(i, pickFr) : avStyle(pickAv, i);
  const face = avatarSvg(kind === 'av' ? i : pickAv);
  return `<div class="cos-cell"><button class="avatar${owned ? '' : ' cos-locked'}" style="${style}" data-cos="${kind}" data-i="${i}" aria-pressed="${picked}" aria-label="${item.name}${owned ? '' : ', costs ' + item.price + ' coins'}">${face}${owned ? '' : '<span class="cos-lock">' + ICONS.lock + '</span>'}</button>
    <span class="cos-price">${owned ? (picked ? 'Equipped' : item.name) : `<span class="coin sm"></span>${fmt(item.price)}`}</span></div>`;
}
function renderProfile(reset = true){
  if (reset){ profTab = 'av'; pickAv = S.profile.avatar; pickFr = S.profile.frame; draftName = S.profile.name; }
  const grid = profTab === 'av'
    ? AVATARS.map((_, i) => cosmeticCell('av', i, i === pickAv)).join('')
    : FRAMES.map((_, i) => cosmeticCell('fr', i, i === pickFr)).join('');
  $('profileBody').innerHTML = `
    <div class="card" style="display:flex;flex-direction:column;gap:10px">
      <div class="name-row"><span class="avatar" style="${avStyle(pickAv, pickFr)}">${avatarSvg(pickAv)}</span><input id="nameInput" maxlength="16" value="${escapeHtml(draftName)}" aria-label="Player name"><span class="lb-lvl"><small>Level</small>${S.level + 1}</span></div>
    </div>
    <div class="section-title">General Stats</div>
    <div class="card"><div class="stat-grid"><div><b>${S.stats.firstTry}</b>First Try Wins</div><div><b>${S.stats.best}</b>Longest Streak</div><div><b>${S.stats.won}</b>Levels Won</div></div></div>
    <div class="tabs" role="tablist"><button class="tab" role="tab" data-pt="av" aria-selected="${profTab === 'av'}">Avatar</button><button class="tab" role="tab" data-pt="fr" aria-selected="${profTab === 'fr'}">Frame</button></div>
    <div class="card"><div class="av-grid">${grid}</div></div>
    <button class="btn btn-green" id="saveProfile">Save</button>`;
  const body = $('profileBody');
  body.querySelector('#nameInput').addEventListener('input', e => { draftName = e.target.value; });
  body.querySelectorAll('[data-pt]').forEach(t => t.addEventListener('click', () => { profTab = t.dataset.pt; click(); renderProfile(false); }));
  body.querySelectorAll('[data-cos]').forEach(b => b.addEventListener('click', () => {
    const kind = b.dataset.cos, i = +b.dataset.i;
    const owned = (kind === 'av' ? S.owned.avatars : S.owned.frames).includes(i);
    click();
    if (!owned){ buyCosmetic(kind, i, () => { if (kind === 'av') pickAv = i; else pickFr = i; renderProfile(false); }); return; }
    if (kind === 'av') pickAv = i; else pickFr = i;
    renderProfile(false);
  }));
  body.querySelector('#saveProfile').addEventListener('click', () => {
    S.profile.name = (draftName.trim() || 'Player').slice(0, 16); S.profile.avatar = pickAv; S.profile.frame = pickFr; save();
    tone(988, .12, .05, 'triangle'); toast('Profile saved'); goHome();
  });
}
$('avatarBtn').addEventListener('click', () => { click(); renderProfile(); showOnly('profile'); });
document.querySelector('[data-close-profile]').addEventListener('click', () => { click(); goHome(); });

/* =========================================================
   BOOT
   ========================================================= */
function start(data){
  resize();
  goHome();
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({ mode }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
