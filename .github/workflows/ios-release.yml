name: Build and Deploy iOS Game

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Build Folder
        run: |
          set -e
          rm -rf www
          mkdir -p www
          cp index.html www/
          cp -r assets www/ 2>/dev/null || true
          cp *.js    www/ 2>/dev/null || true
          cp *.css   www/ 2>/dev/null || true
          echo "--- www contents ---"
          ls -la www

      # The web version loads three.js, cannon.js and the fonts from the internet.
      # The app must work offline (and the privacy policy says it makes no network
      # requests), so this downloads them into the app and points the page at the copies.
      - name: Bundle Libraries and Fonts for Offline Play
        run: |
          set -e
          cd www
          curl -fsSL -o three.min.js  https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
          curl -fsSL -o cannon.min.js https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js
          mkdir -p fonts
          curl -fsSL -o fonts/TitanOne.ttf "https://github.com/google/fonts/raw/main/ofl/titanone/TitanOne-Regular.ttf"
          curl -fsSL -o fonts/Nunito.ttf   "https://github.com/google/fonts/raw/main/ofl/nunito/Nunito%5Bwght%5D.ttf"
          node <<'JS'
          const fs = require('fs');
          let h = fs.readFileSync('index.html', 'utf8');
          h = h.replace('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', 'three.min.js')
               .replace('https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js', 'cannon.min.js')
               .replace(/<link rel="(preconnect|stylesheet)" href="https:\/\/fonts\.[^"]+"[^>]*>\n?/g, '');
          const faces = `<style>
          @font-face{font-family:"Titan One";src:url(fonts/TitanOne.ttf) format("truetype");font-weight:400;font-display:block}
          @font-face{font-family:"Nunito";src:url(fonts/Nunito.ttf) format("truetype");font-weight:200 1000;font-display:block}
          </style>\n`;
          h = h.replace('<title>', faces + '<title>');
          fs.writeFileSync('index.html', h);
          const left = (h.match(/https:\/\/(cdnjs|fonts\.)/g) || []).length;
          console.log(left ? 'XX  ' + left + ' online references left!' : 'OK  index.html is fully offline.');
          if (left) process.exit(1);
          JS
          ls -la . fonts

      - name: Install Mobile Environment Wrapper
        run: |
          set -e
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/ios@5
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "Box Smash" "com.ryan.boxsmash" --web-dir=www
          fi
          npx cap add ios
          npx cap sync ios

      # Bakes your own app icon into the build. Must run AFTER "npx cap add ios",
      # because that step regenerates the whole iOS project and would wipe it.
      - name: Apply App Icon
        run: |
          set -e
          SRC="resources/icon.png"
          if [ ! -f "$SRC" ]; then
            echo "!!  $SRC not found — keeping the default icon."
            exit 0
          fi
          DIM=$(sips -g pixelWidth -g pixelHeight "$SRC" | awk '/pixel/{print $2}' | paste -sd'x' -)
          echo "Source icon: $DIM"
          if [ "$DIM" != "1024x1024" ]; then
            echo "!!  Icon must be exactly 1024x1024. Got $DIM."
            exit 1
          fi
          if sips -g hasAlpha "$SRC" | grep -q "hasAlpha: yes"; then
            echo "    Icon has an alpha channel — flattening it, Apple rejects alpha."
            sips -s format png --deleteColorManagementProperties "$SRC" --out "$RUNNER_TEMP/flat.png" >/dev/null
            SRC="$RUNNER_TEMP/flat.png"
          fi
          SET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          rm -rf "$SET"; mkdir -p "$SET"
          gen () { sips -z "$1" "$1" "$SRC" --out "$SET/$2" >/dev/null; }
          for S in 20 29 40 58 60 76 80 87 120 152 167 180 1024; do
            gen $S "icon-${S}.png"
          done
          cat > "$SET/Contents.json" <<'JSON'
          {
            "images": [
              { "size": "20x20",     "idiom": "iphone",       "filename": "icon-40.png",   "scale": "2x" },
              { "size": "20x20",     "idiom": "iphone",       "filename": "icon-60.png",   "scale": "3x" },
              { "size": "29x29",     "idiom": "iphone",       "filename": "icon-58.png",   "scale": "2x" },
              { "size": "29x29",     "idiom": "iphone",       "filename": "icon-87.png",   "scale": "3x" },
              { "size": "40x40",     "idiom": "iphone",       "filename": "icon-80.png",   "scale": "2x" },
              { "size": "40x40",     "idiom": "iphone",       "filename": "icon-120.png",  "scale": "3x" },
              { "size": "60x60",     "idiom": "iphone",       "filename": "icon-120.png",  "scale": "2x" },
              { "size": "60x60",     "idiom": "iphone",       "filename": "icon-180.png",  "scale": "3x" },
              { "size": "20x20",     "idiom": "ipad",         "filename": "icon-20.png",   "scale": "1x" },
              { "size": "20x20",     "idiom": "ipad",         "filename": "icon-40.png",   "scale": "2x" },
              { "size": "29x29",     "idiom": "ipad",         "filename": "icon-29.png",   "scale": "1x" },
              { "size": "29x29",     "idiom": "ipad",         "filename": "icon-58.png",   "scale": "2x" },
              { "size": "40x40",     "idiom": "ipad",         "filename": "icon-40.png",   "scale": "1x" },
              { "size": "40x40",     "idiom": "ipad",         "filename": "icon-80.png",   "scale": "2x" },
              { "size": "76x76",     "idiom": "ipad",         "filename": "icon-76.png",   "scale": "1x" },
              { "size": "76x76",     "idiom": "ipad",         "filename": "icon-152.png",  "scale": "2x" },
              { "size": "83.5x83.5", "idiom": "ipad",         "filename": "icon-167.png",  "scale": "2x" },
              { "size": "1024x1024", "idiom": "ios-marketing","filename": "icon-1024.png", "scale": "1x" }
            ],
            "info": { "version": 1, "author": "xcode" }
          }
          JSON
          ls -la "$SET"

      # Version, build number, encryption flag, and Box Smash's portrait-only, full-screen setup
      - name: Set Version, Build Number and Orientation
        run: |
          set -e
          PLIST="ios/App/App/Info.plist"
          pb () { /usr/libexec/PlistBuddy -c "Set :$1 $3" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$PLIST"; }
          pb CFBundleShortVersionString string 1.0.0
          pb CFBundleVersion string ${{ github.run_number }}
          pb ITSAppUsesNonExemptEncryption bool false
          pb UIStatusBarHidden bool true
          pb UIViewControllerBasedStatusBarAppearance bool false
          pb UIRequiresFullScreen bool true
          # portrait only, on iPhone and iPad
          for KEY in UISupportedInterfaceOrientations "UISupportedInterfaceOrientations~ipad"; do
            /usr/libexec/PlistBuddy -c "Delete :$KEY" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$KEY array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :$KEY:0 string UIInterfaceOrientationPortrait" "$PLIST"
          done
          echo "Build number: ${{ github.run_number }}"

      - name: Write App Store Connect API Key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -e
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          # printf, not echo — echo mangles the newlines inside a .p8
          printf '%s\n' "$API_KEY_CONTENT" > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          head -1 "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

      # Report only, never fails the build: is the key valid, can it sign, does the app record exist?
      - name: Check what the API key can do
        continue-on-error: true
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          npm install jsonwebtoken@9 --no-save --silent
          node <<'JS'
          const jwt = require('jsonwebtoken');
          const key = process.env.API_KEY_CONTENT;
          if(!key || !key.includes('BEGIN PRIVATE KEY')){
            console.log('XX  The .p8 secret is empty or malformed.');
            process.exit(0);
          }
          const token = jwt.sign({}, key, {
            algorithm: 'ES256', expiresIn: '10m',
            issuer: process.env.API_ISSUER_ID,
            audience: 'appstoreconnect-v1',
            header: { alg:'ES256', kid: process.env.API_KEY_ID, typ:'JWT' }
          });
          const H = { Authorization: 'Bearer ' + token };
          const base = 'https://api.appstoreconnect.apple.com/v1/';
          (async () => {
            let r = await fetch(base + 'apps?limit=1', { headers: H });
            console.log(r.ok ? 'OK  Key is valid and authenticating.'
                             : 'XX  Key rejected (' + r.status + '). Wrong Key ID, Issuer ID or .p8.');
            if(!r.ok) return;
            r = await fetch(base + 'certificates?limit=200', { headers: H });
            if(r.ok){
              const d = await r.json();
              const dist = d.data.filter(c => /DISTRIBUTION/i.test(c.attributes.certificateType));
              console.log('OK  Key can read certificates. ' + dist.length + ' distribution.');
            } else {
              console.log('XX  Key CANNOT read certificates (' + r.status + '). Key role must be Admin.');
            }
            r = await fetch(base + 'apps?filter[bundleId]=com.ryan.boxsmash', { headers: H });
            if(r.ok){
              const d = await r.json();
              console.log(d.data.length
                ? 'OK  App record found: ' + d.data[0].attributes.name
                : 'XX  No app record for com.ryan.boxsmash. Create it in App Store Connect > Apps > + > New App.');
            }
          })();
          JS

      # Archive WITHOUT signing (a cloud runner has no registered device); signing happens at export.
      - name: Archive (unsigned)
        run: |
          set -e
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath "$RUNNER_TEMP/BoxSmash.xcarchive" \
                     DEVELOPMENT_TEAM=XL662VBNF4 \
                     IPHONEOS_DEPLOYMENT_TARGET=15.0 \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_ENTITLEMENTS="" \
                     archive

      - name: Export IPA (signed for the App Store)
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -e
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>XL662VBNF4</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
                     -archivePath "$RUNNER_TEMP/BoxSmash.xcarchive" \
                     -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
                     -exportPath "$RUNNER_TEMP/build" \
                     -allowProvisioningUpdates \
                     -authenticationKeyID "$API_KEY_ID" \
                     -authenticationKeyIssuerID "$API_ISSUER_ID" \
                     -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          ls -la "$RUNNER_TEMP/build"
          IPA=$(find "$RUNNER_TEMP/build" -name '*.ipa' | head -1)
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          uses-non-exempt-encryption: false
          wait-for-processing: false

      - name: Keep the IPA as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BoxSmash-ipa
          path: ${{ runner.temp }}/build
          if-no-files-found: ignore
